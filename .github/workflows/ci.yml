name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Headless boot waits for the keyboard-injection point; hosted runners need
  # more slack than a local workstation. All three are upper bounds: a green
  # run returns as soon as the marker (or guest exit) arrives.
  HAKU_BOOT_DELAY: "30"
  HAKU_HEADLESS_TIMEOUT: "120"
  HAKU_X64_TIMEOUT: "180"

jobs:
  headless:
    name: Headless ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            name: x86-64 (default smp and smp=4)
          - arch: i386
            name: i386 (default smp and smp=4)
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install NASM, LLVM, QEMU, CMake, and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            nasm clang lld qemu-system-x86 cmake ninja-build

      - name: Show tool versions
        run: |
          nasm -v
          clang --version
          lld-link --version
          cmake --version
          ninja --version
          qemu-system-x86_64 --version
          qemu-system-i386 --version

      # CMake only registers the gates; build.py performs every build and
      # boot. Ninja is a single-config generator, so `ctest` needs no -C.
      - name: Configure the CTest suite
        run: cmake -S . -B build/ctest -G Ninja

      # `x64` matches x64 and x64-smp4; `i386` matches i386 and i386-smp4.
      # The tests are marked RUN_SERIAL, so the two QEMU runs share no ports
      # or disk images.
      - name: Build and boot the headless gates
        run: ctest --test-dir build/ctest --output-on-failure -R "^${{ matrix.arch }}"

      - name: Upload boot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haku-headless-${{ matrix.arch }}-${{ github.run_id }}
          path: |
            haku64.img
            build/haku64_fs.img
            build/serial64.log
            build/screen64.ppm
            haku.img
            build/haku_fs.img
            build/serial.log
            build/screen.png
            build/screen.ppm
            build/regs.txt
            build/qemu.log
            build/ctest/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 14

  musl:
    # Boots a binary that was not built with Haku's own library: musl's
    # startup code, TLS, stdio, and file wrappers all run on top of the
    # syscall ABI. This is the only check that exercises an outside libc,
    # so it is a separate job with its own toolchain.
    name: Static musl userland
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install NASM, LLVM, QEMU, and the i686 cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            nasm clang lld qemu-system-x86 gcc-i686-linux-gnu

      # Ubuntu stopped publishing most i386 packages, so musl's headers and
      # static libc come from Debian's musl-dev:i386. The package ships
      # i386-linux-musl-gcc (a wrapper around i686-linux-gnu-gcc from apt),
      # the crt objects, and libc.a; its spec file refers to absolute paths,
      # hence the unpack at /. The SHA-256 pins the exact .deb.
      - name: Install i386 musl headers and static libc
        run: |
          curl -fsSL --retry 5 --retry-delay 2 -o /tmp/musl-dev.deb \
            https://deb.debian.org/debian/pool/main/m/musl/musl-dev_1.2.3-1_i386.deb
          echo "e7e49904a302b4c986cc7729b1af9117f7a01a928b12c43e75bdd015697bff82  /tmp/musl-dev.deb" \
            | sha256sum -c -
          sudo dpkg-deb -x /tmp/musl-dev.deb /
          i386-linux-musl-gcc --version
          ls /usr/lib/i386-linux-musl/libc.a

      - name: Build the probe against musl
        run: |
          mkdir -p build
          # -Wl,-z,separate-code pins the segment layout Haku's loader needs:
          # no two PT_LOAD segments share a page. It is binutils' default on
          # i386, but the loader rejects page-rounded overlap outright.
          # The kernel loads ET_EXEC images, so -no-pie is required, not just
          # desirable; the type check below fails the job if that changes.
          i386-linux-musl-gcc -static -no-pie -fno-pie -Os -Wall -Wextra \
            -Wl,-z,separate-code \
            -o build/musl_probe user/tests/musl_probe.c
          file build/musl_probe
          readelf -h build/musl_probe
          readelf -h build/musl_probe | grep -q 'Class:.*ELF32'
          readelf -h build/musl_probe | grep -q 'Machine:.*Intel 80386'
          readelf -h build/musl_probe | grep -q 'Type:.*EXEC'
          if readelf -l build/musl_probe | grep -q INTERP; then
            echo "musl_probe must be statically linked" >&2
            exit 1
          fi

      - name: Boot the probe as /init
        run: python build.py probe --init=build/musl_probe --expect=MUSL-PROBE-OK

      - name: Upload boot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haku-musl-${{ github.run_id }}
          path: |
            build/serial.log
            build/qemu.log
          if-no-files-found: ignore
          retention-days: 14
